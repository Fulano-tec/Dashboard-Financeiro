<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eletrônicos — Marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app-header"></div>

  <section class="section">
    <div class="section-header">
      <div class="section-title">
        <h2>💻 Eletrônicos Premium</h2>
        <span>Tecnologia moderna e alta performance</span>
      </div>
      <div class="toolbar">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Buscar eletrônicos..." />
        </div>
        <select class="filter-select" id="sortSelect">
          <option value="default">Ordenar</option>
          <option value="price-asc">Menor preço</option>
          <option value="price-desc">Maior preço</option>
          <option value="name">Nome A–Z</option>
        </select>
      </div>
    </div>
    <div class="product-grid" id="productGrid"></div>
  </section>

  <div id="app-footer"></div>
  <div class="toast" id="toast"></div>

  <script src="products.js"></script>
  <script src="common.js"></script>
  <script>
    mountLayout("electronics");
    const CATEGORY = "electronics";
    const grid = document.getElementById("productGrid");
    const searchInput = document.getElementById("searchInput");
    const sortSelect = document.getElementById("sortSelect");

    function getList() {
      const q = (searchInput.value || "").toLowerCase().trim();
      let list = PRODUCTS.filter((p) => p.category === CATEGORY);
      if (q) {
        list = list.filter(
          (p) => p.name.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q)
        );
      }
      const sort = sortSelect.value;
      if (sort === "price-asc") list.sort((a, b) => a.price - b.price);
      else if (sort === "price-desc") list.sort((a, b) => b.price - a.price);
      else if (sort === "name") list.sort((a, b) => a.name.localeCompare(b.name));
      return list;
    }

    function render() {
      const list = getList();
      if (!list.length) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="emoji">🔍</div><h2>Nenhum produto encontrado</h2></div>`;
        return;
      }
      grid.innerHTML = list.map((p) => renderProductCard(p)).join("");
    }

    searchInput.addEventListener("input", render);
    sortSelect.addEventListener("change", render);
    render();
    bindProductEvents(grid);
  </script>
</body>
</html>
